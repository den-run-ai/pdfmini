<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>pdfmini – Compress &amp; combine PDFs privately</title>
  <meta name="description" content="Compress and combine PDF files right in your browser. Free, fast, and private: your files are never uploaded.">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101217" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <!-- Only the app itself and the two pinned libraries may run, and the page can
       only fetch from the pinned PDF.js package: files cannot be sent anywhere. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' blob: 'wasm-unsafe-eval' https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/ https://cdn.jsdelivr.net/npm/pdfjs-dist@6.4.299/; worker-src 'self' blob:; connect-src https://cdn.jsdelivr.net/npm/pdfjs-dist@6.4.299/ blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src data: blob: https://cdn.jsdelivr.net/npm/pdfjs-dist@6.4.299/; base-uri 'none'; form-action 'none'; object-src 'none'">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315803d'/%3E%3Cpath d='M10 8h8l5 5v11a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z' fill='%23fff'/%3E%3Cpath d='M12 18l4 4 4-4M16 13v9' stroke='%2315803d' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --surface-2: #f2f4f6;
      --tab-active: #ffffff;
      --text: #14171c;
      --muted: #5c6470;
      --border: #dfe3e8;
      --accent: #15803d;
      --accent-hover: #166534;
      --accent-text: #15803d;
      --accent-soft: #e8f5ec;
      --danger: #b42318;
      --danger-soft: #fdeceb;
      --focus: #2563eb;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101217;
        --surface: #181b22;
        --surface-2: #20242d;
        --tab-active: #343a46;
        --text: #e8eaee;
        --muted: #a1a8b3;
        --border: #2d323d;
        --accent: #15803d;
        --accent-hover: #1a9248;
        --accent-text: #4ade80;
        --accent-soft: #15291d;
        --danger: #f97066;
        --danger-soft: #3a1d1b;
        --focus: #60a5fa;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    header { text-align: center; margin: 8px 0 20px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; margin: 0; font-size: 26px; letter-spacing: -.02em; }
    .brand svg { width: 34px; height: 34px; }
    .tagline { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
    @media (min-width: 600px) { .card { padding: 24px; } }

    /* Tabs */
    .tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 11px; margin-bottom: 18px; }
    .tab {
      flex: 1; min-height: 42px; border: 0; border-radius: 8px; background: transparent; color: var(--muted);
      font: inherit; font-weight: 600; cursor: pointer;
    }
    .tab[aria-selected="true"] { background: var(--tab-active); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
    [hidden] { display: none !important; }

    /* Drop zone */
    .drop {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      min-height: 150px; padding: 20px; border: 2px dashed var(--border); border-radius: 12px;
      text-align: center; cursor: pointer; transition: border-color .15s, background-color .15s;
    }
    .drop:hover, .drop.dragging { border-color: var(--accent); background: var(--accent-soft); }
    input[type="file"]:focus-visible + .drop { outline: 2px solid var(--focus); outline-offset: 2px; }
    .file-card.dragging, .file-list.dragging { outline: 2px dashed var(--accent); outline-offset: 4px; border-radius: 12px; }
    .drop svg { width: 40px; height: 40px; color: var(--accent-text); }
    .drop-title { font-weight: 650; font-size: 17px; }
    .drop-hint { color: var(--muted); font-size: 14px; }
    @media (hover: none) { .drop-hint.desktop { display: none; } }
    .visually-hidden { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    /* Selected file */
    .file-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2); }
    .file-card svg { flex: none; width: 30px; height: 30px; color: var(--accent-text); }
    .file-text { min-width: 0; flex: 1; }
    .file-name { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-meta { display: block; color: var(--muted); font-size: 14px; }

    /* Levels */
    fieldset { border: 0; padding: 0; margin: 18px 0 0; min-width: 0; }
    legend { font-weight: 650; margin-bottom: 8px; padding: 0; }
    .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .level { position: relative; display: block; }
    .level input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
    .level span {
      display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 64px; padding: 8px 4px;
      border: 1.5px solid var(--border); border-radius: 10px; text-align: center; cursor: pointer; transition: border-color .15s, background-color .15s;
    }
    .level b { font-size: 15px; }
    .level small { color: var(--muted); font-size: 12.5px; line-height: 1.3; }
    .level input:checked + span { border-color: var(--accent); background: var(--accent-soft); }
    .level input:checked + span small { color: var(--text); }
    .level input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }

    /* Advanced settings */
    details.advanced { margin-top: 14px; border: 1px solid var(--border); border-radius: 10px; }
    details.advanced > summary {
      display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; cursor: pointer; list-style: none;
      color: var(--muted); font-size: 15px; font-weight: 600;
    }
    details.advanced > summary::-webkit-details-marker { display: none; }
    .chev { width: 18px; height: 18px; flex: none; transition: transform .15s; }
    details[open] > summary .chev { transform: rotate(90deg); }
    .badge { margin-left: auto; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent-text); }
    .adv-body { display: grid; gap: 14px; padding: 4px 14px 14px; }
    .field label, .field .label { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .field output, .hint { color: var(--muted); font-weight: 400; }
    .hint { font-size: 13px; margin: 6px 0 0; }
    select {
      width: 100%; min-height: 44px; padding: 8px 12px; font: inherit; font-size: 16px; color: var(--text);
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    }
    input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; min-height: 28px; }
    .check { display: flex; align-items: flex-start; gap: 10px; font-size: 15px; cursor: pointer; }
    .check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px;
      border-radius: 10px; border: 1px solid transparent; font: inherit; font-weight: 650; text-decoration: none; cursor: pointer;
      transition: background-color .15s, border-color .15s;
    }
    .btn svg { width: 20px; height: 20px; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
    .btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border); }
    .btn-secondary:hover { border-color: var(--muted); }
    .btn-block { width: 100%; margin-top: 18px; }
    .btn-link { background: none; border: 0; padding: 6px 4px; color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; border-radius: 6px; }
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; flex: none;
      border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer;
    }
    .icon-btn:hover:not(:disabled) { background: var(--surface); color: var(--text); }
    .icon-btn:disabled { opacity: .35; cursor: default; }
    .icon-btn svg { width: 20px; height: 20px; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    /* Progress */
    .progress { margin-top: 18px; }
    .progress-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
    .bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
    .bar > div { height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .2s ease-out; }

    /* Results and errors */
    .result { margin-top: 18px; padding: 16px; border-radius: 12px; background: var(--accent-soft); }
    .result.neutral { background: var(--surface-2); }
    .result h2 { margin: 0; font-size: 20px; }
    .result p { margin: 4px 0 0; color: var(--muted); }
    .sizes { font-variant-numeric: tabular-nums; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .actions .btn { flex: 1 1 140px; }
    .result .note { margin-top: 10px; font-size: 14px; color: var(--text); }
    .alert { margin-top: 18px; padding: 12px 14px; border-radius: 10px; background: var(--danger-soft); color: var(--danger); font-weight: 500; }
    .details { margin-top: 12px; font-size: 13.5px; color: var(--muted); }
    .details summary { cursor: pointer; }
    .details dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 8px 0 0; }
    .details dt { font-weight: 600; }
    .details dd { margin: 0; }

    /* Combine list */
    .file-list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
    .file-item { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); }
    .file-item[draggable="true"] { cursor: grab; }
    .file-item.drag-source { opacity: .45; }
    .file-item.drop-before { box-shadow: 0 -3px 0 var(--accent); }
    .file-item.drop-after { box-shadow: 0 3px 0 var(--accent); }
    .file-item .num { flex: none; width: 22px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
    .file-item .file-text { padding: 4px 0; }
    .summary { margin-top: 12px; color: var(--muted); font-size: 14px; text-align: center; }
    .row { display: flex; gap: 10px; margin-top: 14px; }
    .row .btn { flex: 1; }

    footer { margin: 22px 0 0; text-align: center; color: var(--muted); font-size: 13.5px; }
    footer a { color: inherit; }
    .privacy { display: inline-flex; align-items: center; gap: 6px; }
    .privacy svg { width: 16px; height: 16px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script defer src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js" integrity="sha384-weMABwrltA6jWR8DDe9Jp5blk+tZQh7ugpCsF3JwSA53WZM9/14PjS5LAJNHNjAI" crossorigin="anonymous"></script>
  <script defer src="js/jpeg.js"></script>
  <script defer src="js/engine.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#15803d"/><path d="M10 8h8l5 5v11a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z" fill="#fff"/><path d="M12 18l4 4 4-4M16 13v9" stroke="#15803d" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        pdfmini
      </h1>
      <p class="tagline">Compress and combine PDFs, right in your browser.</p>
    </header>

    <main class="card">
      <div class="tabs" role="tablist" aria-label="Tool">
        <button class="tab" role="tab" id="tab-compress" aria-controls="panel-compress" aria-selected="true">Compress</button>
        <button class="tab" role="tab" id="tab-combine" aria-controls="panel-combine" aria-selected="false" tabindex="-1">Combine</button>
      </div>

      <!-- Compress -->
      <section id="panel-compress" role="tabpanel" aria-labelledby="tab-compress">
        <input type="file" id="compress-input" class="visually-hidden" accept="application/pdf,.pdf">
        <label class="drop" id="compress-drop" for="compress-input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M20 16v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2"/></svg>
          <span class="drop-title">Choose a PDF</span>
          <span class="drop-hint desktop">or drop it here</span>
        </label>

        <div class="file-card" id="compress-file" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
          <div class="file-text">
            <span class="file-name" id="compress-name"></span>
            <span class="file-meta" id="compress-meta"></span>
          </div>
          <button type="button" class="btn-link" id="compress-change">Change</button>
        </div>

        <fieldset>
          <legend>Compression</legend>
          <div class="levels">
            <label class="level"><input type="radio" name="level" value="light"><span><b>Light</b><small>Best quality</small></span></label>
            <label class="level"><input type="radio" name="level" value="balanced" checked><span><b>Balanced</b><small>Recommended</small></span></label>
            <label class="level"><input type="radio" name="level" value="strong"><span><b>Strong</b><small>Smallest file</small></span></label>
          </div>
        </fieldset>

        <details class="advanced" id="advanced">
          <summary><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>Advanced settings <span class="badge" id="custom-badge" hidden>Custom</span></summary>
          <div class="adv-body">
            <div class="field">
              <label for="opt-mode">Method</label>
              <select id="opt-mode">
                <option value="images">Keep text, compress images</option>
                <option value="rasterize">Convert pages to images</option>
              </select>
              <p class="hint" id="mode-hint">Text stays sharp and searchable. Best for most documents.</p>
            </div>
            <div class="field">
              <label for="opt-dpi">Image resolution <output id="opt-dpi-out" for="opt-dpi"></output></label>
              <input type="range" id="opt-dpi" min="72" max="300" step="1">
            </div>
            <div class="field">
              <label for="opt-quality">Image quality <output id="opt-quality-out" for="opt-quality"></output></label>
              <input type="range" id="opt-quality" min="30" max="95" step="1">
            </div>
            <label class="check"><input type="checkbox" id="opt-gray"> <span>Convert images to grayscale</span></label>
            <label class="check"><input type="checkbox" id="opt-meta"> <span>Remove document info (title, author, etc.)</span></label>
            <div><button type="button" class="btn-link" id="opt-reset">Reset to defaults</button></div>
          </div>
        </details>

        <button type="button" class="btn btn-primary btn-block" id="compress-btn" disabled>Compress PDF</button>

        <div class="progress" id="compress-progress" hidden>
          <div class="progress-row"><span id="compress-status" aria-live="polite">Starting…</span><button type="button" class="btn-link" id="compress-cancel">Cancel</button></div>
          <div class="bar" role="progressbar" aria-labelledby="compress-status" aria-valuemin="0" aria-valuemax="100" id="compress-bar"><div></div></div>
        </div>
        <div class="alert" id="compress-error" role="alert" hidden></div>
        <div class="result" id="compress-result" hidden tabindex="-1">
          <h2 id="compress-headline"></h2>
          <p class="sizes" id="compress-sizes"></p>
          <p class="note" id="compress-note" hidden></p>
          <div class="actions">
            <a class="btn btn-primary" id="compress-download" download>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>
              Download
            </a>
            <button type="button" class="btn btn-secondary" id="compress-share" hidden>Share</button>
          </div>
          <details class="details" id="compress-details">
            <summary>Details</summary>
            <dl id="compress-dl"></dl>
          </details>
        </div>
      </section>

      <!-- Combine -->
      <section id="panel-combine" role="tabpanel" aria-labelledby="tab-combine" hidden>
        <input type="file" id="combine-input" class="visually-hidden" accept="application/pdf,.pdf" multiple>
        <label class="drop" id="combine-drop" for="combine-input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="3" width="12" height="14" rx="2"/><path d="M16 21H6a2 2 0 0 1-2-2V7"/></svg>
          <span class="drop-title">Choose PDFs</span>
          <span class="drop-hint desktop">or drop them here</span>
        </label>

        <ol class="file-list" id="combine-list" aria-label="Files to combine, in order"></ol>
        <p class="summary" id="combine-summary" hidden></p>
        <div class="row" id="combine-row" hidden>
          <button type="button" class="btn btn-secondary" id="combine-add">Add files</button>
          <button type="button" class="btn btn-primary" id="combine-btn" disabled>Combine</button>
        </div>

        <div class="progress" id="combine-progress" hidden>
          <div class="progress-row"><span id="combine-status" aria-live="polite">Starting…</span><button type="button" class="btn-link" id="combine-cancel">Cancel</button></div>
          <div class="bar" role="progressbar" aria-labelledby="combine-status" aria-valuemin="0" aria-valuemax="100" id="combine-bar"><div></div></div>
        </div>
        <div class="alert" id="combine-error" role="alert" hidden></div>
        <div class="result" id="combine-result" hidden tabindex="-1">
          <h2 id="combine-headline"></h2>
          <p class="sizes" id="combine-sizes"></p>
          <div class="actions">
            <a class="btn btn-primary" id="combine-download" download>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>
              Download
            </a>
            <button type="button" class="btn btn-secondary" id="combine-share" hidden>Share</button>
            <button type="button" class="btn btn-secondary" id="combine-compress">Compress it</button>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p class="privacy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        Your files never leave your device.
      </p>
      <p><a href="https://github.com/den-run-ai/pdfmini">Open source on GitHub</a></p>
    </footer>
  </div>
  <noscript><p style="text-align:center">pdfmini needs JavaScript to process PDFs in your browser.</p></noscript>
</body>
</html>
